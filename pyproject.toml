[project]
name = "thelmic"
version = "0.1.0"
description = "An instrument you ride, not configure."
requires-python = ">=3.11"
dependencies = [
    "python-rtmidi>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.pytest.ini_options]
testpaths = ["tests"]
