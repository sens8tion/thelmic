<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>thelmic</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --oak:   #2a7a4f;
      --chaos: #8b3a8b;
      --nott:  #1a3a5c;
      --bg:    #0d0d0d;
      --surface: #161616;
      --border:  #2a2a2a;
      --text:    #e0e0e0;
      --dim:     #666;
      --accent:  #c0a060;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', monospace;
      font-size: 13px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
      gap: 28px;
    }

    h1 {
      font-size: 22px;
      letter-spacing: 0.25em;
      color: var(--accent);
      font-weight: normal;
    }

    /* ── Territory strip ── */
    .territory-strip {
      display: flex;
      width: 100%;
      max-width: 640px;
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
    }
    .territory-strip span {
      flex: 1;
    }
    .territory-strip .oak   { background: var(--oak); }
    .territory-strip .chaos { background: var(--chaos); }
    .territory-strip .nott  { background: var(--nott); }

    /* ── Axis section ── */
    .axis-section {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .axis-labels {
      display: flex;
      justify-content: space-between;
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 0.12em;
    }

    #axis-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 36px;
      background: transparent;
      cursor: pointer;
      outline: none;
    }

    #axis-slider::-webkit-slider-runnable-track {
      height: 36px;
      border-radius: 4px;
      background: linear-gradient(
        to right,
        var(--oak) 0%,
        var(--chaos) 50%,
        var(--nott) 100%
      );
    }

    #axis-slider::-moz-range-track {
      height: 36px;
      border-radius: 4px;
      background: linear-gradient(
        to right,
        var(--oak) 0%,
        var(--chaos) 50%,
        var(--nott) 100%
      );
    }

    #axis-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 52px;
      margin-top: -8px;
      background: #fff;
      border-radius: 3px;
      box-shadow: 0 0 8px rgba(0,0,0,0.8);
    }

    #axis-slider::-moz-range-thumb {
      width: 18px;
      height: 52px;
      background: #fff;
      border-radius: 3px;
      border: none;
      box-shadow: 0 0 8px rgba(0,0,0,0.8);
    }

    .territory-name {
      text-align: center;
      font-size: 18px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      height: 24px;
      transition: color 0.3s;
    }
    .territory-name.oak   { color: var(--oak); }
    .territory-name.chaos { color: var(--chaos); }
    .territory-name.nott  { color: var(--nott); }

    /* ── Force state bars ── */
    .force-grid {
      width: 100%;
      max-width: 640px;
      display: grid;
      grid-template-columns: 160px 1fr 48px;
      row-gap: 10px;
      column-gap: 12px;
      align-items: center;
    }

    .force-label {
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-align: right;
    }

    .force-bar-track {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      height: 14px;
      overflow: hidden;
    }

    .force-bar-fill {
      height: 100%;
      border-radius: 2px;
      background: var(--accent);
      transition: width 0.12s ease;
    }

    .force-value {
      color: var(--dim);
      font-size: 11px;
      text-align: right;
    }

    /* ── Controls ── */
    .controls-section {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .controls-section h2 {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--dim);
      font-weight: normal;
      text-transform: uppercase;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .control-row {
      display: grid;
      grid-template-columns: 160px 1fr 48px;
      gap: 12px;
      align-items: center;
    }

    .control-row label {
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-align: right;
    }

    .control-row input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .control-row input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: var(--accent);
      border-radius: 50%;
    }

    .control-row input[type=range]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      background: var(--accent);
      border-radius: 50%;
      border: none;
    }

    .control-value {
      color: var(--dim);
      font-size: 11px;
      text-align: right;
    }

    /* ── Transport ── */
    .transport {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    button {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      letter-spacing: 0.15em;
      padding: 10px 28px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      border-radius: 2px;
      transition: background 0.15s, border-color 0.15s;
    }

    button:hover { background: #222; }

    button.playing {
      border-color: var(--accent);
      color: var(--accent);
    }

    .bpm-control {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--dim);
      font-size: 12px;
    }

    #bpm-input {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      width: 56px;
      padding: 6px 8px;
      border-radius: 2px;
      text-align: center;
    }

    /* ── Status ── */
    .status-bar {
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 0.08em;
      height: 18px;
    }

    .status-bar.ok  { color: var(--oak); }
    .status-bar.err { color: #a04040; }

    /* ── Bank counter ── */
    .bank-count {
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>

  <h1>thelmic</h1>

  <div class="territory-strip">
    <span class="oak"></span>
    <span class="chaos"></span>
    <span class="nott"></span>
  </div>

  <!-- Axis -->
  <div class="axis-section">
    <div class="axis-labels">
      <span>Oak</span>
      <span>Chaos</span>
      <span>Nott</span>
    </div>
    <input type="range" id="axis-slider" min="0" max="1000" value="0" step="1">
    <div class="territory-name oak" id="territory-name">Oak</div>
  </div>

  <!-- Force state -->
  <div class="force-grid">
    <div class="force-label">anticipation</div>
    <div class="force-bar-track"><div class="force-bar-fill" id="bar-anticipation" style="width:0%"></div></div>
    <div class="force-value" id="val-anticipation">0.00</div>

    <div class="force-label">release pressure</div>
    <div class="force-bar-track"><div class="force-bar-fill" id="bar-release_pressure" style="width:0%"></div></div>
    <div class="force-value" id="val-release_pressure">0.00</div>

    <div class="force-label">instability</div>
    <div class="force-bar-track"><div class="force-bar-fill" id="bar-instability" style="width:0%"></div></div>
    <div class="force-value" id="val-instability">0.00</div>

    <div class="force-label">density</div>
    <div class="force-bar-track"><div class="force-bar-fill" id="bar-density" style="width:0%"></div></div>
    <div class="force-value" id="val-density">0.00</div>

    <div class="force-label">control / chaos</div>
    <div class="force-bar-track"><div class="force-bar-fill" id="bar-control_vs_chaos" style="width:0%"></div></div>
    <div class="force-value" id="val-control_vs_chaos">0.00</div>

    <div class="force-label">resolution likelihood</div>
    <div class="force-bar-track"><div class="force-bar-fill" id="bar-resolution_likelihood" style="width:0%;background:#5a8a7a"></div></div>
    <div class="force-value" id="val-resolution_likelihood">0.00</div>
  </div>

  <!-- Controls -->
  <div class="controls-section">
    <h2>Controls</h2>

    <div class="control-row">
      <label>groove lock</label>
      <input type="range" id="ctrl-groove_lock" min="0" max="1000" value="800" step="1">
      <div class="control-value" id="ctrlval-groove_lock">0.80</div>
    </div>
    <div class="control-row">
      <label>chaos limit</label>
      <input type="range" id="ctrl-chaos_limit" min="0" max="1000" value="1000" step="1">
      <div class="control-value" id="ctrlval-chaos_limit">1.00</div>
    </div>
    <div class="control-row">
      <label>density ceiling</label>
      <input type="range" id="ctrl-density_ceiling" min="0" max="1000" value="1000" step="1">
      <div class="control-value" id="ctrlval-density_ceiling">1.00</div>
    </div>
    <div class="control-row">
      <label>variation rate</label>
      <input type="range" id="ctrl-variation_rate" min="0" max="1000" value="500" step="1">
      <div class="control-value" id="ctrlval-variation_rate">0.50</div>
    </div>
    <div class="control-row">
      <label>kick dominance</label>
      <input type="range" id="ctrl-kick_dominance" min="0" max="1000" value="700" step="1">
      <div class="control-value" id="ctrlval-kick_dominance">0.70</div>
    </div>
  </div>

  <!-- Transport -->
  <div class="transport">
    <button id="play-btn" onclick="togglePlay()">PLAY</button>
    <div class="bpm-control">
      <span>BPM</span>
      <input type="number" id="bpm-input" value="174" min="60" max="300"
             onchange="sendBpm()" onblur="sendBpm()">
    </div>
    <div class="bank-count" id="bank-count">banks: 0</div>
  </div>

  <div class="status-bar" id="status">connecting…</div>

  <script>
    let ws = null;
    let reconnectTimer = null;

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws`);

      ws.onopen = () => {
        setStatus('connected', 'ok');
        clearTimeout(reconnectTimer);
      };

      ws.onclose = () => {
        setStatus('disconnected — reconnecting…', 'err');
        reconnectTimer = setTimeout(connect, 2000);
      };

      ws.onerror = () => {
        setStatus('connection error', 'err');
      };

      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'state') applyState(msg);
      };
    }

    function send(obj) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(obj));
      }
    }

    // ── Axis ──
    const axisSlider = document.getElementById('axis-slider');
    let axisThrottle = null;

    axisSlider.addEventListener('input', () => {
      const val = axisSlider.value / 1000;
      updateTerritoryDisplay(val);
      clearTimeout(axisThrottle);
      axisThrottle = setTimeout(() => send({ type: 'axis', value: val }), 30);
    });

    function updateTerritoryDisplay(pos) {
      const el = document.getElementById('territory-name');
      let t, cls;
      if (pos < 0.33) { t = 'Oak';   cls = 'oak'; }
      else if (pos < 0.67) { t = 'Chaos'; cls = 'chaos'; }
      else { t = 'Nott';  cls = 'nott'; }
      el.textContent = t;
      el.className = `territory-name ${cls}`;
    }

    // ── Controls ──
    const controlKeys = ['groove_lock', 'chaos_limit', 'density_ceiling', 'variation_rate', 'kick_dominance'];
    const controlThrottles = {};

    controlKeys.forEach(key => {
      const el = document.getElementById(`ctrl-${key}`);
      if (!el) return;
      el.addEventListener('input', () => {
        const val = el.value / 1000;
        document.getElementById(`ctrlval-${key}`).textContent = val.toFixed(2);
        clearTimeout(controlThrottles[key]);
        controlThrottles[key] = setTimeout(() => send({ type: 'control', key, value: val }), 50);
      });
    });

    // ── Transport ──
    let isPlaying = false;

    function togglePlay() {
      send({ type: isPlaying ? 'stop' : 'play' });
    }

    function sendBpm() {
      const val = parseFloat(document.getElementById('bpm-input').value) || 174;
      send({ type: 'bpm', value: val });
    }

    // ── State application ──
    function applyState(s) {
      // Axis — only update slider if not currently dragging
      if (document.activeElement !== axisSlider) {
        axisSlider.value = Math.round(s.landscape_position * 1000);
      }
      updateTerritoryDisplay(s.landscape_position);

      // Force bars
      const dims = ['anticipation', 'release_pressure', 'instability', 'density', 'control_vs_chaos', 'resolution_likelihood'];
      dims.forEach(d => {
        const bar = document.getElementById(`bar-${d}`);
        const val = document.getElementById(`val-${d}`);
        const v = s[d] ?? 0;
        if (bar) bar.style.width = `${(v * 100).toFixed(1)}%`;
        if (val) val.textContent = v.toFixed(2);
      });

      // Transport
      isPlaying = s.playing;
      const btn = document.getElementById('play-btn');
      btn.textContent = isPlaying ? 'STOP' : 'PLAY';
      btn.className = isPlaying ? 'playing' : '';

      // BPM
      if (document.activeElement.id !== 'bpm-input') {
        document.getElementById('bpm-input').value = s.bpm;
      }

      // Bank count
      document.getElementById('bank-count').textContent = `banks: ${s.bank_count}`;
    }

    function setStatus(msg, cls) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = `status-bar ${cls || ''}`;
    }

    connect();
  </script>
</body>
</html>
