<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thelmic v1.01</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0d0d;
      --panel: #151515;
      --line: #2b2b2b;
      --text: #e4e0d2;
      --muted: #85806f;
      --accent: #c6a35b;
      --kick: #d0a13c;
      --snare: #b8b0a0;
      --hat: #5fbf91;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Courier New", monospace;
      padding: 24px;
    }
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0.22em;
      font-weight: 400;
      color: var(--accent);
      margin: 0;
    }
    .status {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      text-align: right;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    button, input {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      padding: 8px 10px;
      font-family: inherit;
    }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    .grid {
      display: grid;
      grid-template-columns: 96px repeat(64, minmax(8px, 1fr));
      gap: 1px;
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--line);
      background: var(--line);
    }
    .label, .cell {
      min-height: 22px;
      background: #101010;
    }
    .label {
      position: sticky;
      left: 0;
      z-index: 2;
      color: var(--muted);
      padding: 5px 8px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .cell {
      position: relative;
      border-left: 1px solid transparent;
    }
    .playhead { box-shadow: inset 2px 0 0 var(--accent); }
    .bar { border-left-color: #555; }
    .phrase { border-left-color: var(--accent); }
    .hit::after {
      content: "";
      position: absolute;
      inset: 4px 2px;
    }
    .kick.hit::after { background: var(--kick); }
    .snare.hit::after { background: var(--snare); }
    .hat.hit::after { background: var(--hat); }
    .meta {
      margin-top: 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 8px 24px;
    }
  </style>
</head>
<body>
  <header>
    <h1>THELMIC V1.01</h1>
    <div class="status">
      <div id="runtime">connecting</div>
      <div id="versions"></div>
    </div>
  </header>

  <div class="controls">
    <button onclick="send({type:'start'})">start</button>
    <button onclick="send({type:'stop'})">stop</button>
    <label>bpm <input id="bpm" type="number" min="60" max="300" value="174" onchange="send({type:'bpm', value:this.value})"></label>
    <button onclick="refreshPorts()">refresh midi ports</button>
    <select id="midiPorts" onchange="send({type:'midi_port', value:this.value})"></select>
  </div>

  <div id="grid" class="grid"></div>
  <div id="meta" class="meta"></div>

  <script>
    const STEPS = 64;
    const BANK_STEPS = 256;
    const PLAYHEAD_COLUMN = 16;
    const layers = ["kick", "snare", "hat"];
    let ws;
    let latestState = null;

    function connect() {
      ws = new WebSocket(`ws://${location.host}/ws`);
      ws.onopen = () => document.getElementById("runtime").textContent = "connected";
      ws.onclose = () => {
        document.getElementById("runtime").textContent = "disconnected";
        setTimeout(connect, 1000);
      };
      ws.onmessage = event => {
        const state = JSON.parse(event.data);
        if (state.type === "state") {
          latestState = state;
          render(state);
        }
      };
    }

    function send(message) {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(message));
    }

    async function refreshPorts() {
      const select = document.getElementById("midiPorts");
      const response = await fetch("/api/midi-ports");
      const data = await response.json();
      select.innerHTML = '<option value="">no midi output</option>';
      for (const port of data.ports || []) {
        const option = document.createElement("option");
        option.value = port;
        option.textContent = port;
        select.appendChild(option);
      }
    }

    function render(state) {
      document.getElementById("runtime").textContent = `${state.runtime_mode} ${state.playing ? "running" : "stopped"}`;
      document.getElementById("versions").textContent = `${state.thelmic_version} / rules ${state.music_rules_version}`;
      document.getElementById("bpm").value = state.bpm || 174;

      drawGrid(state);

      document.getElementById("meta").innerHTML = `
        <div>events: ${(state.runtime && state.runtime.event_count) || (state.bank_events || []).length}</div>
        <div>pression: ${state.pression_engine_version}</div>
        <div>legacy fallback: ${state.runtime && state.runtime.legacy_fallback_enabled}</div>
        <div>post-generation rescue: ${state.runtime && state.runtime.post_generation_rescue_enabled}</div>
      `;
    }

    function currentStep(state) {
      if (!state.playing || !state.bank_started_at_ms || !state.bank_duration_ms) {
        return state.playhead_step || 0;
      }
      const elapsed = (Date.now() - state.bank_started_at_ms) % state.bank_duration_ms;
      return Math.max(0, Math.min(BANK_STEPS - 1, Math.floor((elapsed / state.bank_duration_ms) * BANK_STEPS)));
    }

    function drawGrid(state) {
      const frames = state.structure_frames || [];
      const events = state.bank_events || [];
      const byLayerStep = new Set(events.map(event => `${event.layer}:${event.musical_step}`));
      const playheadStep = currentStep(state);
      const windowStart = Math.max(0, Math.min(BANK_STEPS - STEPS, playheadStep - PLAYHEAD_COLUMN));
      const grid = document.getElementById("grid");
      grid.innerHTML = "";

      for (const layer of layers) {
        const label = document.createElement("div");
        label.className = "label";
        label.textContent = layer;
        grid.appendChild(label);
        for (let column = 0; column < STEPS; column++) {
          const step = windowStart + column;
          const frame = frames[step] || {};
          const cell = document.createElement("div");
          cell.className = `cell ${layer}`;
          if (frame.is_bar_start) cell.classList.add("bar");
          if (frame.is_phrase_start) cell.classList.add("phrase");
          if (step === playheadStep) cell.classList.add("playhead");
          if (byLayerStep.has(`${layer}:${step}`)) cell.classList.add("hit");
          cell.title = `step ${step} bar ${frame.bar_index ?? "-"} ${frame.phrase_role ?? ""}`;
          grid.appendChild(cell);
        }
      }
    }

    function animate() {
      if (latestState && latestState.playing) drawGrid(latestState);
      requestAnimationFrame(animate);
    }

    refreshPorts();
    connect();
    animate();
  </script>
</body>
</html>
