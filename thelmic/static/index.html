<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>thelmic</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --oak:   #2a7a4f;
      --chaos: #8b3a8b;
      --nott:  #1a3a5c;
      --bg:    #0d0d0d;
      --surface: #161616;
      --border:  #2a2a2a;
      --text:    #e0e0e0;
      --dim:     #666;
      --accent:  #c0a060;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', monospace;
      font-size: 13px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 24px;
      gap: 28px;
    }

    h1 {
      font-size: 22px;
      letter-spacing: 0.25em;
      color: var(--accent);
      font-weight: normal;
    }

    /* ── Territory strip ── */
    .territory-strip {
      display: flex;
      width: 100%;
      max-width: 640px;
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
    }
    .territory-strip span {
      flex: 1;
    }
    .territory-strip .oak   { background: var(--oak); }
    .territory-strip .chaos { background: var(--chaos); }
    .territory-strip .nott  { background: var(--nott); }

    /* ── Axis section ── */
    .axis-section {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .axis-labels {
      display: flex;
      justify-content: space-between;
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 0.12em;
    }

    #axis-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 36px;
      background: transparent;
      cursor: pointer;
      outline: none;
    }

    #axis-slider::-webkit-slider-runnable-track {
      height: 36px;
      border-radius: 4px;
      background: linear-gradient(
        to right,
        var(--oak) 0%,
        var(--chaos) 50%,
        var(--nott) 100%
      );
    }

    #axis-slider::-moz-range-track {
      height: 36px;
      border-radius: 4px;
      background: linear-gradient(
        to right,
        var(--oak) 0%,
        var(--chaos) 50%,
        var(--nott) 100%
      );
    }

    #axis-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 52px;
      margin-top: -8px;
      background: #fff;
      border-radius: 3px;
      box-shadow: 0 0 8px rgba(0,0,0,0.8);
    }

    #axis-slider::-moz-range-thumb {
      width: 18px;
      height: 52px;
      background: #fff;
      border-radius: 3px;
      border: none;
      box-shadow: 0 0 8px rgba(0,0,0,0.8);
    }

    .territory-name {
      text-align: center;
      font-size: 18px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      height: 24px;
      transition: color 0.3s;
    }
    .territory-name.oak   { color: var(--oak); }
    .territory-name.chaos { color: var(--chaos); }
    .territory-name.nott  { color: var(--nott); }

    /* ── Force state bars ── */
    .force-grid {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .force-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .force-row-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .force-label {
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 0.08em;
    }

    .force-bar-track {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      height: 10px;
      overflow: hidden;
      width: 100%;
    }

    .force-bar-fill {
      height: 100%;
      border-radius: 2px;
      background: var(--accent);
      transition: width 0.12s ease;
    }

    .force-value {
      color: var(--dim);
      font-size: 11px;
    }

    /* ── Controls ── */
    .controls-section {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .controls-section h2 {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--dim);
      font-weight: normal;
      text-transform: uppercase;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .control-row {
      display: grid;
      grid-template-columns: minmax(60px, 120px) 1fr 40px;
      gap: 6px;
      align-items: center;
    }

    .control-row label {
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-align: right;
    }

    .control-row input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .control-row input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: var(--accent);
      border-radius: 50%;
    }

    .control-row input[type=range]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      background: var(--accent);
      border-radius: 50%;
      border: none;
    }

    .control-value {
      color: var(--dim);
      font-size: 11px;
      text-align: right;
    }

    /* ── Transport ── */
    .transport {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      letter-spacing: 0.15em;
      padding: 10px 28px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      border-radius: 2px;
      transition: background 0.15s, border-color 0.15s;
    }

    button:hover { background: #222; }

    button.playing {
      border-color: var(--accent);
      color: var(--accent);
    }

    .bpm-control {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--dim);
      font-size: 12px;
    }

    #bpm-input {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      width: 56px;
      padding: 6px 8px;
      border-radius: 2px;
      text-align: center;
    }

    /* ── Status ── */
    .status-bar {
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 0.08em;
      height: 18px;
    }

    .status-bar.ok  { color: var(--oak); }
    .status-bar.err { color: #a04040; }

    /* ── Bank counter ── */
    .bank-count {
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 0.08em;
    }

    /* ── Archetype lock ── */
    .archetype-section {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .archetype-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    #archetype-select {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 8px;
      border-radius: 2px;
      flex: 1;
      min-width: 0;
    }

    .archetype-current {
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--dim);
    }

    .archetype-current.locked { color: #e0a030; }

    /* ── MIDI section ── */
    .midi-section {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .midi-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    #midi-port-select {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 8px;
      border-radius: 2px;
      flex: 1;
      min-width: 0;
    }

    .midi-refresh-btn {
      padding: 6px 10px;
      font-size: 14px;
      flex-shrink: 0;
    }

    .midi-status {
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--dim);
    }

    .midi-status.connected { color: var(--oak); }
    .midi-status.error     { color: #a04040; }

    /* ── Sequencer ── */
    .seq-section {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .seq-heading {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--dim);
      font-weight: normal;
      text-transform: uppercase;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .seq-legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .seq-legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 0.06em;
    }

    .seq-legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 1px;
    }

    .seq-scroll {
      overflow-x: auto;
      width: 100%;
    }

    .seq-grid {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 480px;
    }

    .seq-lane {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .seq-lane-label {
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding-bottom: 1px;
    }

    .seq-lane-row {
      display: grid;
      /* 16 bars × 16 steps = 256 cells */
      grid-template-columns: repeat(256, 1fr);
      height: 18px;
      gap: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .seq-cell {
      height: 100%;
      border-right: 1px solid transparent;
    }

    /* Bar dividers (every 16 steps) */
    .seq-cell.bar-start {
      border-left: 1px solid #333;
    }

    /* Phrase dividers (every 64 steps) */
    .seq-cell.phrase-start {
      border-left: 1px solid #555;
    }

    /* Role colours */
    .seq-cell.role-anchor              { background: #c0a060; }
    .seq-cell.role-ghost               { background: #444; }
    .seq-cell.role-disruption          { background: #8b3a8b; }
    .seq-cell.role-impact              { background: #e05050; }
    .seq-cell.role-withheld_resolution { background: #2a5a8a; }
  </style>
</head>
<body>

  <h1>thelmic</h1>

  <div class="territory-strip">
    <span class="oak"></span>
    <span class="chaos"></span>
    <span class="nott"></span>
  </div>

  <!-- Axis -->
  <div class="axis-section">
    <div class="axis-labels">
      <span>Oak</span>
      <span>Chaos</span>
      <span>Nott</span>
    </div>
    <input type="range" id="axis-slider" min="0" max="1000" value="0" step="1">
    <div class="territory-name oak" id="territory-name">Oak</div>
  </div>

  <!-- Force state -->
  <div class="force-grid">
    <div class="force-row">
      <div class="force-row-header"><span class="force-label">anticipation</span><span class="force-value" id="val-anticipation">0.00</span></div>
      <div class="force-bar-track"><div class="force-bar-fill" id="bar-anticipation" style="width:0%"></div></div>
    </div>
    <div class="force-row">
      <div class="force-row-header"><span class="force-label">release pressure</span><span class="force-value" id="val-release_pressure">0.00</span></div>
      <div class="force-bar-track"><div class="force-bar-fill" id="bar-release_pressure" style="width:0%"></div></div>
    </div>
    <div class="force-row">
      <div class="force-row-header"><span class="force-label">instability</span><span class="force-value" id="val-instability">0.00</span></div>
      <div class="force-bar-track"><div class="force-bar-fill" id="bar-instability" style="width:0%"></div></div>
    </div>
    <div class="force-row">
      <div class="force-row-header"><span class="force-label">density</span><span class="force-value" id="val-density">0.00</span></div>
      <div class="force-bar-track"><div class="force-bar-fill" id="bar-density" style="width:0%"></div></div>
    </div>
    <div class="force-row">
      <div class="force-row-header"><span class="force-label">control / chaos</span><span class="force-value" id="val-control_vs_chaos">0.00</span></div>
      <div class="force-bar-track"><div class="force-bar-fill" id="bar-control_vs_chaos" style="width:0%"></div></div>
    </div>
    <div class="force-row">
      <div class="force-row-header"><span class="force-label">resolution likelihood</span><span class="force-value" id="val-resolution_likelihood">0.00</span></div>
      <div class="force-bar-track"><div class="force-bar-fill" id="bar-resolution_likelihood" style="width:0%;background:#5a8a7a"></div></div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls-section">
    <h2>Controls</h2>

    <div class="control-row">
      <label>groove lock</label>
      <input type="range" id="ctrl-groove_lock" min="0" max="1000" value="800" step="1">
      <div class="control-value" id="ctrlval-groove_lock">0.80</div>
    </div>
    <div class="control-row">
      <label>chaos limit</label>
      <input type="range" id="ctrl-chaos_limit" min="0" max="1000" value="1000" step="1">
      <div class="control-value" id="ctrlval-chaos_limit">1.00</div>
    </div>
    <div class="control-row">
      <label>density ceiling</label>
      <input type="range" id="ctrl-density_ceiling" min="0" max="1000" value="1000" step="1">
      <div class="control-value" id="ctrlval-density_ceiling">1.00</div>
    </div>
    <div class="control-row">
      <label>variation rate</label>
      <input type="range" id="ctrl-variation_rate" min="0" max="1000" value="500" step="1">
      <div class="control-value" id="ctrlval-variation_rate">0.50</div>
    </div>
    <div class="control-row">
      <label>kick dominance</label>
      <input type="range" id="ctrl-kick_dominance" min="0" max="1000" value="700" step="1">
      <div class="control-value" id="ctrlval-kick_dominance">0.70</div>
    </div>
  </div>

  <!-- Archetype lock -->
  <div class="archetype-section">
    <h2 class="seq-heading" style="border-top:none;padding-top:0">ARCHETYPE</h2>
    <div class="archetype-row">
      <select id="archetype-select" onchange="setArchetypeLock()">
        <option value="">— auto —</option>
      </select>
      <div class="archetype-current" id="archetype-current">auto</div>
    </div>
  </div>

  <!-- MIDI port selector -->
  <div class="midi-section">
    <h2 class="seq-heading" style="border-top:none;padding-top:0">MIDI OUT</h2>
    <div class="midi-row">
      <select id="midi-port-select" onchange="selectMidiPort()">
        <option value="">— select port —</option>
      </select>
      <button class="midi-refresh-btn" onclick="refreshPorts()" title="Refresh ports">⟳</button>
      <div class="midi-status" id="midi-status">not connected</div>
    </div>
  </div>

  <!-- Transport -->
  <div class="transport">
    <button id="play-btn" onclick="togglePlay()">PLAY</button>
    <div class="bpm-control">
      <span>BPM</span>
      <input type="number" id="bpm-input" value="174" min="60" max="300"
             onchange="sendBpm()" onblur="sendBpm()">
    </div>
    <div class="bank-count" id="bank-count">banks: 0</div>
  </div>

  <!-- Sequencer -->
  <div class="seq-section" id="seq-section">
    <h2 class="seq-heading">SEQUENCER — bank <span id="seq-bank-num">—</span></h2>
    <div class="seq-legend" id="seq-legend"></div>
    <div class="seq-scroll">
      <div class="seq-grid" id="seq-grid"></div>
    </div>
  </div>

  <div class="status-bar" id="status">connecting…</div>

  <script>
    let ws = null;
    let reconnectTimer = null;

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws`);

      ws.onopen = () => {
        setStatus('connected', 'ok');
        clearTimeout(reconnectTimer);
        onConnected();
      };

      ws.onclose = () => {
        setStatus('disconnected — reconnecting…', 'err');
        reconnectTimer = setTimeout(connect, 2000);
      };

      ws.onerror = () => {
        setStatus('connection error', 'err');
      };

      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'state') applyState(msg);
        else if (msg.type === 'error') setStatus(msg.message, 'err');
      };
    }

    function send(obj) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(obj));
      }
    }

    // ── Axis ──
    const axisSlider = document.getElementById('axis-slider');
    let axisThrottle = null;

    axisSlider.addEventListener('input', () => {
      const val = axisSlider.value / 1000;
      updateTerritoryDisplay(val);
      clearTimeout(axisThrottle);
      axisThrottle = setTimeout(() => send({ type: 'axis', value: val }), 30);
    });

    function updateTerritoryDisplay(pos) {
      const el = document.getElementById('territory-name');
      let t, cls;
      if (pos < 0.33) { t = 'Oak';   cls = 'oak'; }
      else if (pos < 0.67) { t = 'Chaos'; cls = 'chaos'; }
      else { t = 'Nott';  cls = 'nott'; }
      el.textContent = t;
      el.className = `territory-name ${cls}`;
    }

    // ── Controls ──
    const controlKeys = ['groove_lock', 'chaos_limit', 'density_ceiling', 'variation_rate', 'kick_dominance'];
    const controlThrottles = {};

    controlKeys.forEach(key => {
      const el = document.getElementById(`ctrl-${key}`);
      if (!el) return;
      el.addEventListener('input', () => {
        const val = el.value / 1000;
        document.getElementById(`ctrlval-${key}`).textContent = val.toFixed(2);
        clearTimeout(controlThrottles[key]);
        controlThrottles[key] = setTimeout(() => send({ type: 'control', key, value: val }), 50);
      });
    });

    // ── Transport ──
    let isPlaying = false;

    function togglePlay() {
      send({ type: isPlaying ? 'stop' : 'play' });
    }

    function sendBpm() {
      const val = parseFloat(document.getElementById('bpm-input').value) || 174;
      send({ type: 'bpm', value: val });
    }

    // ── State application ──
    function applyState(s) {
      // Axis — only update slider if not currently dragging
      if (document.activeElement !== axisSlider) {
        axisSlider.value = Math.round(s.landscape_position * 1000);
      }
      updateTerritoryDisplay(s.landscape_position);

      // Force bars
      const dims = ['anticipation', 'release_pressure', 'instability', 'density', 'control_vs_chaos', 'resolution_likelihood'];
      dims.forEach(d => {
        const bar = document.getElementById(`bar-${d}`);
        const val = document.getElementById(`val-${d}`);
        const v = s[d] ?? 0;
        if (bar) bar.style.width = `${(v * 100).toFixed(1)}%`;
        if (val) val.textContent = v.toFixed(2);
      });

      // Transport
      isPlaying = s.playing;
      const btn = document.getElementById('play-btn');
      btn.textContent = isPlaying ? 'STOP' : 'PLAY';
      btn.className = isPlaying ? 'playing' : '';

      // BPM
      if (document.activeElement.id !== 'bpm-input') {
        document.getElementById('bpm-input').value = s.bpm;
      }

      // Bank count
      document.getElementById('bank-count').textContent = `banks: ${s.bank_count}`;

      // Archetype lock
      updateArchetypeDisplay(s.locked_archetype, s.archetype);

      // MIDI port status
      const midiStatus = document.getElementById('midi-status');
      if (s.midi_port) {
        midiStatus.textContent = s.midi_port;
        midiStatus.className = 'midi-status connected';
      } else {
        midiStatus.textContent = 'not connected';
        midiStatus.className = 'midi-status';
      }

      // Sequencer
      if (s.bank_events !== undefined) {
        renderSequencer(s.bank_events, s.bank_count);
      }
    }

    // ── MIDI ports ──
    async function refreshPorts() {
      try {
        const res = await fetch('/api/midi-ports');
        const data = await res.json();
        const sel = document.getElementById('midi-port-select');
        const current = sel.value;
        sel.innerHTML = '<option value="">— select port —</option>';
        data.ports.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p;
          opt.textContent = p;
          if (p === current) opt.selected = true;
          sel.appendChild(opt);
        });
      } catch (e) {
        setStatus('failed to list MIDI ports', 'err');
      }
    }

    function selectMidiPort() {
      const val = document.getElementById('midi-port-select').value;
      if (val) send({ type: 'midi_port', value: val });
    }

    // Load ports on connect
    function onConnected() {
      refreshPorts();
      loadArchetypes();
    }

    // ── Archetype lock ──
    async function loadArchetypes() {
      try {
        const res = await fetch('/api/archetypes');
        const data = await res.json();
        const sel = document.getElementById('archetype-select');
        sel.innerHTML = '<option value="">— auto —</option>';
        data.archetypes.forEach(name => {
          const opt = document.createElement('option');
          opt.value = name;
          opt.textContent = name.replace(/_/g, ' ');
          sel.appendChild(opt);
        });
      } catch (e) {}
    }

    function setArchetypeLock() {
      const val = document.getElementById('archetype-select').value || null;
      send({ type: 'lock_archetype', value: val });
    }

    function updateArchetypeDisplay(locked, current) {
      const sel = document.getElementById('archetype-select');
      const label = document.getElementById('archetype-current');
      if (document.activeElement !== sel) {
        sel.value = locked || '';
      }
      if (locked) {
        label.textContent = locked.replace(/_/g, ' ') + ' 🔒';
        label.className = 'archetype-current locked';
      } else {
        label.textContent = (current || 'auto').replace(/_/g, ' ');
        label.className = 'archetype-current';
      }
    }

    // ── Sequencer ──
    const BARS = 16;       // 4 phrases × 4 bars
    const STEPS = 16;      // 16th-note resolution per bar
    const TOTAL_STEPS = BARS * STEPS;  // 256

    const ROLE_COLOURS = {
      anchor:              '#c0a060',
      ghost:               '#444',
      disruption:          '#8b3a8b',
      impact:              '#e05050',
      withheld_resolution: '#2a5a8a',
    };

    function timeToStep(timeStr) {
      // "bar.beat.tick" — bar is 1-indexed within bank, beat 1-4, tick 0-23
      const [bar, beat, tick] = timeStr.split('.').map(Number);
      const beatStep = Math.floor((tick / 24) * 4); // tick→16th within beat
      return (bar - 1) * STEPS + (beat - 1) * 4 + beatStep;
    }

    function renderSequencer(events, bankCount) {
      document.getElementById('seq-bank-num').textContent = bankCount || '—';

      // Collect layers
      const layers = [...new Set(events.map(e => e.layer))].sort();
      if (layers.length === 0) {
        document.getElementById('seq-grid').innerHTML = '<div style="color:#444;font-size:11px;padding:8px 0">no events — press play</div>';
        document.getElementById('seq-legend').innerHTML = '';
        return;
      }

      // Build step maps per layer
      const stepMap = {};
      layers.forEach(l => { stepMap[l] = new Array(TOTAL_STEPS).fill(null); });
      events.forEach(e => {
        const step = timeToStep(e.time);
        if (step >= 0 && step < TOTAL_STEPS) {
          stepMap[e.layer][step] = e;
        }
      });

      // Render lanes
      const grid = document.getElementById('seq-grid');
      grid.innerHTML = '';
      layers.forEach(layer => {
        const lane = document.createElement('div');
        lane.className = 'seq-lane';

        const label = document.createElement('div');
        label.className = 'seq-lane-label';
        label.textContent = layer;
        lane.appendChild(label);

        const row = document.createElement('div');
        row.className = 'seq-lane-row';

        for (let s = 0; s < TOTAL_STEPS; s++) {
          const cell = document.createElement('div');
          cell.className = 'seq-cell';
          if (s % (STEPS * 4) === 0) cell.classList.add('phrase-start');
          else if (s % STEPS === 0) cell.classList.add('bar-start');

          const ev = stepMap[layer][s];
          if (ev) {
            cell.classList.add(`role-${ev.role}`);
            const alpha = 0.4 + ev.emphasis * 0.6;
            cell.style.opacity = alpha.toFixed(2);
            cell.title = `${ev.role} vel:${ev.velocity}`;
          }
          row.appendChild(cell);
        }
        lane.appendChild(row);
        grid.appendChild(lane);
      });

      // Legend
      const legend = document.getElementById('seq-legend');
      legend.innerHTML = '';
      Object.entries(ROLE_COLOURS).forEach(([role, colour]) => {
        const item = document.createElement('div');
        item.className = 'seq-legend-item';
        const dot = document.createElement('div');
        dot.className = 'seq-legend-dot';
        dot.style.background = colour;
        const name = document.createElement('span');
        name.textContent = role.replace('_', ' ');
        item.appendChild(dot);
        item.appendChild(name);
        legend.appendChild(item);
      });
    }

    function setStatus(msg, cls) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = `status-bar ${cls || ''}`;
    }

    connect();
  </script>
</body>
</html>
